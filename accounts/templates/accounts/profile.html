{% extends "base.html" %}

{% block content %}
    <!-- Page heading -->
    <h1>My Profile</h1>

    <!-- Display logged-in user's username -->
    <p><strong>Username:</strong> {{ user.username }}</p>

    <!-- Display logged-in user's email -->
    <p><strong>Email:</strong> {{ user.email }}</p>
        
    <!-- Link to account settings (edit personal details, etc.) -->
    <p><strong>Phone Number:</strong> {{ user.profile.phone|default:"Not provided" }}</p>

    <hr>
    
    <!-- Link to account and logout -->
    <a href="{% url 'account_settings' %}" class="btn btn-outline-primary">Edit Account Settings</a>
    <a href="{% url 'logout' %}" class="btn btn-outline-danger">Logout</a>
{% endblock %}
